<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MLIR Viz</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --line: #262b36;
    --fg: #d7dae0;
    --dim: #7d8697;
    --accent: #5aa9e6;
    --err: #e5534b;
    --good: #58c58b;
    --warn: #e5b34b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  header h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  header .sp { flex: 1; }
  button, label.btn {
    background: #222733; color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button:hover, label.btn:hover { border-color: var(--accent); }
  #file { display: none; }
  main { display: flex; flex: 1 1 auto; min-height: 0; }
  #source-pane { width: 38%; min-width: 260px; resize: horizontal; overflow: auto; border-right: 1px solid var(--line); }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #source-pane h2, #diff-pane h2 { margin: 0; padding: 7px 10px; color: var(--dim); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  #baseline {
    flex: 1; min-height: 120px; resize: none; border: 0; border-bottom: 1px solid var(--line);
    background: #10141b; color: var(--fg); padding: 10px; font: inherit; tab-size: 2;
    outline: none; white-space: pre; overflow-wrap: normal;
  }
  #editor {
    flex: 1; min-height: 120px; resize: none; overflow: auto;
    background: #12151b; color: var(--fg);
    border: 0;
    padding: 10px; font: inherit; tab-size: 2;
    outline: none; white-space: pre; overflow-wrap: normal;
  }
  #stage { position: relative; flex: 1 1 auto; min-width: 0; }
  #diff-pane { width: 280px; border-left: 1px solid var(--line); overflow: auto; }
  #diff-summary { padding: 0 10px 8px; color: var(--dim); }
  #diff-list { margin: 0; padding: 0 10px 12px; list-style: none; }
  #diff-list li { border-top: 1px solid var(--line); padding: 7px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #diff-list .added { color: var(--good); }
  #diff-list .removed { color: var(--err); }
  #diff-list .changed { color: var(--warn); }
  @media (max-width: 900px) { #diff-pane { width: 220px; } }
  @media (max-width: 680px) { main { flex-direction: column; } #source-pane, #diff-pane { width: 100%; min-width: 0; resize: none; } #source-pane { height: 42%; border-right: 0; border-bottom: 1px solid var(--line); } #diff-pane { height: 28%; border-left: 0; border-top: 1px solid var(--line); } }
  #canvas { display: block; width: 100%; height: 100%; }
  #status {
    flex: 0 0 auto;
    display: flex; gap: 16px; align-items: center;
    padding: 4px 12px;
    background: var(--panel);
    border-top: 1px solid var(--line);
    color: var(--dim); font-size: 12px;
  }
  #status .bad { color: var(--err); }
  #diags {
    position: absolute; right: 10px; top: 10px;
    max-width: 44%; max-height: 45%; overflow: auto;
    background: rgba(23,26,33,.94);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 8px; font-size: 12px;
  }
  #diags:empty { display: none; }
  #diags div { color: var(--err); white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MLIR VIZ</h1>
    <label class="btn" for="file">Open…</label>
    <input id="file" type="file" accept=".mlir,.txt" />
    <button id="reparse">Compare</button>
    <button id="fit">Fit</button>
    <span class="sp"></span>
    <span id="abi"></span>
  </header>

  <main>
    <section id="source-pane" class="pane">
      <h2>Baseline</h2>
      <textarea id="baseline" spellcheck="false" placeholder="Paste baseline MLIR here…"></textarea>
      <h2>Current</h2>
      <textarea id="editor" spellcheck="false" placeholder="Paste current MLIR here…"></textarea>
    </section>
    <div id="stage">
      <canvas id="canvas"></canvas>
      <div id="diags"></div>
    </div>
    <aside id="diff-pane" class="pane">
      <h2>Pass diff</h2>
      <div id="diff-summary">No comparison yet</div>
      <ul id="diff-list"></ul>
    </aside>
  </main>

  <div id="status">
    <span id="stat-nodes">nodes 0</span>
    <span id="stat-edges">edges 0</span>
    <span id="stat-syms">syms 0</span>
    <span id="stat-time">— ms</span>
    <span id="stat-flags"></span>
    <span id="detail">—</span>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
