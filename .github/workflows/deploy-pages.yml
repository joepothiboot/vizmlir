name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check the live site serves the build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            html=$(curl -fsSL -H "Cache-Control: no-cache" "$PAGE_URL?check=$GITHUB_SHA") || html=""
            if grep -q 'src="[^"]*/assets/index-[^"]*\.js"' <<<"$html"; then
              echo "Live site serves the Vite bundle."
              exit 0
            fi
            sleep 10
          done
          echo "::error::$PAGE_URL is not serving the Vite build. Set Settings > Pages > Source to 'GitHub Actions'."
          grep -n '<script' <<<"$html" || true
          exit 1
