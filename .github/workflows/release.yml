name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: npm test
      - run: npm run build

  notify-lab:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Tell compiler-tooling-lab to re-pin
        env:
          GH_TOKEN: ${{ secrets.LAB_DISPATCH_TOKEN }}
        run: >
          gh api repos/joepothiboot/compiler-tooling-lab/dispatches
          -f event_type=project-release
          -f "client_payload[project]=vizmlir"
          -f "client_payload[ref]=$GITHUB_REF_NAME"
